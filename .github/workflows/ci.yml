name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    # Task Scheduler is Windows only. Standard runner: larger runners are billed even on public repos.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Build everything first: `dotnet test` only builds what the tests reference.
      - name: Build
        run: dotnet build Schedulry.slnx -c Release

      - name: Test
        run: dotnet test Schedulry.slnx -c Release --no-build --verbosity normal

  # Secrets scan over the whole history. The private-term denylist is deliberately NOT here:
  # its terms are the sensitive data, so it lives only on developer machines (tools/hooks).
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history with gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
